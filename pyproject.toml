[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paired-discrimination-bounds"
version = "0.1.0"
description = "Sharp bounds for paired discrimination under label nonresponse"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "PyYAML==6.0.3",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
